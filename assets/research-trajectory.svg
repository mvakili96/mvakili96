<svg xmlns="http://www.w3.org/2000/svg" width="768" height="250" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Parallel railway-perception research across RGB, vision-language, and mobile LiDAR</title>
  <desc id="desc">An RGB and vision research timeline from TPE-Net to TRIT-Net and ego-path reasoning segmentation, with a parallel mobile LiDAR study for 3D track and switch recognition.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#121a34"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="lidarLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" opacity="0.10"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="388" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="388" rx="24" fill="url(#dots)"/>

  <text x="52" y="42" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">RESEARCH TRAJECTORY</text>
  <rect x="52" y="105" width="116" height="28" rx="14" fill="#0e7490" fill-opacity="0.20" stroke="#22d3ee" stroke-opacity="0.36"/>
  <text x="110" y="123" fill="#67e8f9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="800" letter-spacing="1.3" text-anchor="middle">RGB</text>
  <path d="M 205 119 L 995 119" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
  <path d="M 205 119 L 995 119" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>

  <g fill="none" stroke-width="4" filter="url(#nodeGlow)">
    <circle cx="205" cy="119" r="15" stroke="#22d3ee" fill="#0e7490"/>
    <circle cx="600" cy="119" r="15" stroke="#60a5fa" fill="#1d4ed8"/>
    <circle cx="995" cy="119" r="15" stroke="#a78bfa" fill="#6d28d9"/>
  </g>
  <g fill="#e2e8f0">
    <path d="M 386 112 L 400 119 L 386 126 Z"/>
    <path d="M 781 112 L 795 119 L 781 126 Z"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
    <text x="205" y="83" fill="#67e8f9" font-size="17" font-weight="800" letter-spacing="1.5">TPE-NET</text>
    <text x="205" y="162" fill="#f8fafc" font-size="18" font-weight="700">Candidate path extraction</text>
    <text x="205" y="189" fill="#94a3b8" font-size="14">Triplet regression · path trees</text>

    <text x="600" y="83" fill="#93c5fd" font-size="17" font-weight="800" letter-spacing="1.5">TRIT-NET</text>
    <text x="600" y="162" fill="#f8fafc" font-size="18" font-weight="700">Learned instance tracing</text>
    <text x="600" y="189" fill="#94a3b8" font-size="14">Attraction fields · self-supervision</text>

    <text x="995" y="83" fill="#c4b5fd" font-size="17" font-weight="800" letter-spacing="1.5">VISION-LANGUAGE</text>
    <text x="995" y="162" fill="#f8fafc" font-size="18" font-weight="700">Reasoning-guided segmentation</text>
    <text x="995" y="189" fill="#94a3b8" font-size="14">Image + language · ego-path reasoning segmentation</text>
  </g>

  <path d="M 52 220 L 1148 220" stroke="#334155" stroke-opacity="0.72"/>

  <rect x="52" y="256" width="116" height="28" rx="14" fill="#047857" fill-opacity="0.20" stroke="#34d399" stroke-opacity="0.40"/>
  <text x="110" y="274" fill="#6ee7b7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="800" letter-spacing="1.3" text-anchor="middle">MOBILE LIDAR</text>
  <path d="M 205 270 L 995 270" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
  <path d="M 205 270 L 995 270" stroke="url(#lidarLine)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="600" cy="270" r="15" stroke="#34d399" stroke-width="4" fill="#047857" filter="url(#nodeGlow)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
    <text x="600" y="241" fill="#6ee7b7" font-size="17" font-weight="800" letter-spacing="1.5">MULTI-RAILWAY AUTOMATIC DATA EXTRACTION</text>
    <text x="600" y="313" fill="#f8fafc" font-size="18" font-weight="700">3D track and switch recognition</text>
    <text x="600" y="345" fill="#94a3b8" font-size="14">Kalman filtering · MDL · multiscale template matching</text>
  </g>
</svg>
