<svg xmlns="http://www.w3.org/2000/svg" width="768" height="166" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Research progression from TPE-Net to TRIT-Net to vision-language reasoning</title>
  <desc id="desc">A three-stage timeline showing candidate path extraction, learned instance tracing, and reasoning-guided valid-route segmentation.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#121a34"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" opacity="0.10"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="258" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="258" rx="24" fill="url(#dots)"/>

  <text x="52" y="42" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">RESEARCH TRAJECTORY</text>
  <path d="M 205 108 L 995 108" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
  <path d="M 205 108 L 995 108" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>

  <g fill="none" stroke-width="4" filter="url(#nodeGlow)">
    <circle cx="205" cy="108" r="15" stroke="#22d3ee" fill="#0e7490"/>
    <circle cx="600" cy="108" r="15" stroke="#60a5fa" fill="#1d4ed8"/>
    <circle cx="995" cy="108" r="15" stroke="#a78bfa" fill="#6d28d9"/>
  </g>
  <g fill="#e2e8f0">
    <path d="M 386 101 L 400 108 L 386 115 Z"/>
    <path d="M 781 101 L 795 108 L 781 115 Z"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
    <text x="205" y="78" fill="#67e8f9" font-size="17" font-weight="800" letter-spacing="1.5">TPE-NET</text>
    <text x="205" y="151" fill="#f8fafc" font-size="18" font-weight="700">Candidate-path extraction</text>
    <text x="205" y="178" fill="#94a3b8" font-size="14">RGB · triplet regression · path trees</text>

    <text x="600" y="78" fill="#93c5fd" font-size="17" font-weight="800" letter-spacing="1.5">TRIT-NET</text>
    <text x="600" y="151" fill="#f8fafc" font-size="18" font-weight="700">Learned instance tracing</text>
    <text x="600" y="178" fill="#94a3b8" font-size="14">Attraction fields · self-supervision</text>

    <text x="995" y="78" fill="#c4b5fd" font-size="17" font-weight="800" letter-spacing="1.5">VISION-LANGUAGE</text>
    <text x="995" y="151" fill="#f8fafc" font-size="18" font-weight="700">Reasoning-guided segmentation</text>
    <text x="995" y="178" fill="#94a3b8" font-size="14">Image + language · valid ego-path</text>
  </g>

  <text x="600" y="224" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" text-anchor="middle">From extracting possible paths to reasoning about the physically valid route</text>
</svg>
