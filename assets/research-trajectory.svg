<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="296" viewBox="0 0 1200 296" role="img" aria-labelledby="title desc">
  <title id="title">Research across RGB, vision-language models, and mobile LiDAR</title>
  <desc id="desc">TPE-Net candidate path extraction progresses to TRIT-Net instance tracing and vision-language ego-path reasoning segmentation. Mobile LiDAR track and switch recognition is a separate, parallel research line.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#121a34"/>
    </linearGradient>
    <linearGradient id="rgbLine" gradientUnits="userSpaceOnUse" x1="230" y1="68" x2="970" y2="68">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="294" rx="20" fill="url(#panel)" stroke="#334155" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
    <rect x="36" y="52" width="132" height="32" rx="16" fill="#0e7490" fill-opacity="0.20" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="102" y="68" dominant-baseline="middle" fill="#67e8f9" font-size="14" font-weight="700">RGB</text>

    <path d="M 230 68 H 970" fill="none" stroke="url(#rgbLine)" stroke-width="3"/>
    <path d="M 406 63 L 416 68 L 406 73 Z M 776 63 L 786 68 L 776 73 Z" fill="#cbd5e1"/>
    <circle cx="230" cy="68" r="10" fill="#0e7490" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="600" cy="68" r="10" fill="#1d4ed8" stroke="#60a5fa" stroke-width="3"/>
    <circle cx="970" cy="68" r="10" fill="#6d28d9" stroke="#a78bfa" stroke-width="3"/>

    <text x="230" y="36" fill="#67e8f9" font-size="18" font-weight="700">TPE-Net</text>
    <text x="230" y="108" fill="#f8fafc" font-size="18" font-weight="600">Candidate path extraction</text>
    <text x="230" y="133" fill="#cbd5e1" font-size="15">Triplet regression · Path trees</text>

    <text x="600" y="36" fill="#93c5fd" font-size="18" font-weight="700">TRIT-Net</text>
    <text x="600" y="108" fill="#f8fafc" font-size="18" font-weight="600">Learned instance tracing</text>
    <text x="600" y="133" fill="#cbd5e1" font-size="15">Attraction fields · Self-supervision</text>

    <text x="970" y="36" fill="#c4b5fd" font-size="18" font-weight="700">Vision-language</text>
    <text x="970" y="108" fill="#f8fafc" font-size="18" font-weight="600">Ego-path reasoning segmentation</text>
    <text x="970" y="133" fill="#cbd5e1" font-size="15">Image + language</text>

    <path d="M 36 158 H 1164" stroke="#334155"/>

    <rect x="36" y="212" width="132" height="32" rx="16" fill="#047857" fill-opacity="0.20" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="102" y="228" dominant-baseline="middle" fill="#6ee7b7" font-size="14" font-weight="700">Mobile LiDAR</text>

    <text x="600" y="195" fill="#6ee7b7" font-size="18" font-weight="700">Multi-railway automatic data extraction</text>
    <path d="M 230 228 H 970" stroke="#34d399" stroke-opacity="0.5" stroke-width="3"/>
    <circle cx="600" cy="228" r="10" fill="#047857" stroke="#34d399" stroke-width="3"/>
    <text x="600" y="269" fill="#cbd5e1" font-size="16">3D tracks and switches · Kalman filtering · MDL · Multiscale template matching</text>
  </g>
</svg>
