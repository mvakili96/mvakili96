<svg xmlns="http://www.w3.org/2000/svg" width="768" height="205" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Mohammadjavad Ghorbanalivakili — AI Research Engineer</title>
  <desc id="desc">A simple dark banner introducing Mohammadjavad Ghorbanalivakili and his work in computer vision, multimodal AI, and autonomous perception.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08101f"/>
      <stop offset="0.52" stop-color="#0d1830"/>
      <stop offset="1" stop-color="#111936"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="320" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="27" fill="none" stroke="#60a5fa" stroke-opacity="0.24" stroke-width="2"/>

  <text x="70" y="68" fill="#67e8f9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="3">HELLO, I'M</text>
  <text x="70" y="122" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="750" letter-spacing="-1.2">Mohammadjavad Ghorbanalivakili</text>
  <text x="70" y="166" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="500">AI Research Engineer <tspan fill="#64748b">·</tspan> PhD Candidate</text>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">
    <rect x="70" y="208" width="194" height="42" rx="21" fill="#0e7490" fill-opacity="0.25" stroke="#22d3ee" stroke-opacity="0.48"/>
    <text x="167" y="229" fill="#a5f3fc" dominant-baseline="middle">COMPUTER VISION</text>
    <rect x="280" y="208" width="180" height="42" rx="21" fill="#1d4ed8" fill-opacity="0.22" stroke="#60a5fa" stroke-opacity="0.48"/>
    <text x="370" y="229" fill="#bfdbfe" dominant-baseline="middle">MULTIMODAL AI</text>
    <rect x="476" y="208" width="260" height="42" rx="21" fill="#6d28d9" fill-opacity="0.20" stroke="#a78bfa" stroke-opacity="0.48"/>
    <text x="606" y="229" fill="#ddd6fe" dominant-baseline="middle">AUTONOMOUS PERCEPTION</text>
  </g>

  <text x="70" y="282" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">Toronto, Canada  ·  Open to relocation</text>
</svg>
